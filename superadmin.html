<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=1400">

<title>10Cricket Super Admin</title>

<style>

/* ===== SAME DESIGN (NO CHANGE) ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#e9f5ea;
min-width:1400px;
overflow-x:auto;
}

.topbar{
background:#0f7b32;
color:#fff;
padding:14px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

.logo{
font-size:34px;
font-style:italic;
color:#d7ff5d;
text-shadow:1px 1px 2px #000;
}

.top-right{
display:flex;
gap:10px;
align-items:center;
}

.top-btn{
background:#063d17;
color:#fff;
padding:8px 14px;
border-radius:5px;
font-size:14px;
}

.navbar{
background:#04280f;
color:white;
display:flex;
padding:12px 20px;
gap:15px;
font-size:14px;
overflow-x:auto;
border-bottom:3px solid #1fc75f;
}

.nav-item{
background:#063d17;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.nav-item:hover{
background:#1fc75f;
}

.active{
background:#1fc75f;
}

.green-bar{
background:#1fc75f;
height:35px;
}

.container{
background:white;
margin:20px;
padding:20px;
border-radius:8px;
}

button{
padding:10px 15px;
background:#0f7b32;
color:white;
border:none;
cursor:pointer;
font-weight:bold;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#063d17;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
}

.status-active{
background:#1db954;
color:white;
padding:4px 8px;
border-radius:5px;
}

.action-btn{
background:#063d17;
color:white;
padding:5px 8px;
margin-right:5px;
cursor:pointer;
border-radius:4px;
}

.empty{
text-align:center;
padding:30px;
color:gray;
}

</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
<div class="logo">10Cricket</div>

<div class="top-right">
<div class="top-btn">SUA Admin</div>
<div class="top-btn">PBU 0.00</div>
<div class="top-btn" onclick="logout()">Logout</div>
</div>
</div>

<!-- NAV -->
<div class="navbar">
<div class="nav-item active">Dashboard</div>
<div class="nav-item">Downline</div>
</div>

<!-- MAIN -->
<div class="container">

<button onclick="addAdmin()">+ Add Admin</button>

<button onclick="goLogin()">Admin Login</button>

<table>

<thead>
<tr>
<th>Name</th>
<th>Password</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="adminTable">
<tr><td colspan="4" class="empty">No Admin Created</td></tr>
</tbody>

</table>

</div>

<script>

/* ===== DATA ===== */
let users = JSON.parse(localStorage.getItem("users")) || [];

/* ===== LOAD ===== */
function load(){

let table = document.getElementById("adminTable");
table.innerHTML = "";

if(users.length === 0){
table.innerHTML = `<tr><td colspan="4" class="empty">No Admin Created</td></tr>`;
return;
}

users.forEach((u,i)=>{
table.innerHTML += `
<tr>
<td>${u.name}</td>
<td>${u.password}</td>
<td><span class="status-active">Active</span></td>
<td>
<span class="action-btn" onclick="del(${i})">Delete</span>
</td>
</tr>
`;
});

localStorage.setItem("users",JSON.stringify(users));

}

/* ===== ADD ADMIN ===== */
function addAdmin(){

let name = prompt("Enter Admin Name");
let pass = prompt("Enter Password");

if(!name || !pass) return;

/* save admin */
users.push({
name:name,
password:pass,
role:"admin"
});

load();

}

/* ===== DELETE ===== */
function del(i){
users.splice(i,1);
load();
}

/* ===== LOGIN PAGE ===== */
function goLogin(){
location.href="login.html";
}

/* ===== LOGOUT ===== */
function logout(){
localStorage.clear();
location.reload();
}

load();

</script>

</body>
</html>
