<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10cricket.live Login</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(#062b06,#4caf00);
}

.top{
width:100%;
height:340px;
overflow:hidden;
border-bottom-left-radius:20% 60px;
border-bottom-right-radius:20% 60px;
}

.top img{
width:100%;
height:100%;
object-fit:cover;
}

.form{
width:92%;
max-width:380px;
margin:90px auto 0 auto;
}

.inputBox{
margin-bottom:15px;
}

.inputBox input{
width:100%;
height:55px;
border-radius:15px;
border:none;
outline:none;
padding:0 15px;
font-size:16px;
background:#f2f2f2;
box-sizing:border-box;
}

.passwordBox{
position:relative;
}

.passwordBox input{
padding-right:45px;
}

.toggle{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:18px;
}

.btn{
width:100%;
height:55px;
border:none;
border-radius:15px;
background:#000;
color:#ffcc00;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

footer{
background:#0b0b0b;
color:#fff;
padding:25px 15px;
text-align:center;
margin-top:50px;
}

.footer-links{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
font-size:13px;
margin-top:10px;
}

.footer-links a{
color:#fff;
text-decoration:none;
opacity:0.85;
}
</style>
</head>

<body>

<div class="top">
<img src="login-banner.png">
</div>

<div class="form">

<form id="loginForm">

<div class="inputBox">
<input type="text" id="username" placeholder="Username" required>
</div>

<div class="inputBox passwordBox">
<input type="password" id="password" placeholder="Password" required>
<span class="toggle" onclick="togglePassword()">👁</span>
</div>

<button class="btn" type="submit">LOGIN</button>

</form>

</div>

<footer>
© 2026 10cricket.live
</footer>

<script>

function togglePassword(){
let p = document.getElementById("password");
p.type = (p.type === "password") ? "text" : "password";
}

/* ==============================
   🔐 ROLE LOGIN SYSTEM
============================== */

document.getElementById("loginForm").addEventListener("submit", function(e){
e.preventDefault();

let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

/* 👑 SUPER ADMIN */
if(user === "superadmin" && pass === "1234"){
  localStorage.setItem("role","superadmin");
  window.location.href = "superadmin.html";
}

/* 🧑 ADMIN */
else if(user === "admin" && pass === "1234"){
  localStorage.setItem("role","admin");
  window.location.href = "admin.html";
}

/* 🧾 SUB ADMIN */
else if(user === "subadmin" && pass === "1234"){
  localStorage.setItem("role","subadmin");
  window.location.href = "subadmin.html";
}

/* 🧑‍💼 SUPER AGENT */
else if(user === "superagent" && pass === "1234"){
  localStorage.setItem("role","superagent");
  window.location.href = "superagent.html";
}

/* 👤 AGENT */
else if(user === "agent" && pass === "1234"){
  localStorage.setItem("role","agent");
  window.location.href = "agent.html";
}

/* ❌ WRONG */
else{
  alert("Wrong Username or Password ❌");
}

});

</script>

</body>
</html>
