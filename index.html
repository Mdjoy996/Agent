<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AG Panel</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    /* LOGIN */

    #loginPage{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:320px;
      background:#1e293b;
      padding:30px;
      border-radius:14px;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-top:14px;
      border:none;
      outline:none;
      border-radius:8px;
      background:#334155;
      color:white;
    }

    .login-box button{
      width:100%;
      padding:12px;
      margin-top:18px;
      border:none;
      border-radius:8px;
      background:#22c55e;
      color:white;
      font-weight:600;
      cursor:pointer;
      font-size:15px;
    }

    #status{
      text-align:center;
      margin-top:12px;
      color:#cbd5e1;
      font-size:14px;
    }

    /* DASHBOARD */

    #dashboard{
      display:none;
    }

    .sidebar{
      position:fixed;
      width:230px;
      height:100vh;
      background:#111827;
      padding-top:20px;
    }

    .logo{
      text-align:center;
      font-size:22px;
      font-weight:600;
      margin-bottom:30px;
      color:#22c55e;
    }

    .menu{
      padding:0 15px;
    }

    .menu button{
      width:100%;
      padding:13px;
      margin-bottom:12px;
      border:none;
      border-radius:10px;
      background:#1e293b;
      color:white;
      cursor:pointer;
      text-align:left;
      font-size:15px;
    }

    .menu button:hover{
      background:#22c55e;
    }

    .main{
      margin-left:230px;
      padding:20px;
    }

    .topbar{
      background:#1e293b;
      padding:18px;
      border-radius:12px;
      margin-bottom:20px;
      font-size:18px;
      font-weight:500;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .card{
      background:#1e293b;
      padding:25px;
      border-radius:14px;
    }

    .card h2{
      font-size:30px;
      margin-top:10px;
      color:#22c55e;
    }

    .card p{
      color:#cbd5e1;
      font-size:14px;
    }

    .card input{
      width:100%;
      padding:10px;
      margin-top:12px;
      border:none;
      border-radius:8px;
      background:#334155;
      color:white;
    }

    .card button{
      width:100%;
      padding:10px;
      margin-top:12px;
      border:none;
      border-radius:8px;
      background:#22c55e;
      color:white;
      cursor:pointer;
      font-weight:600;
    }

    table{
      width:100%;
      margin-top:15px;
      border-collapse:collapse;
    }

    table th, table td{
      padding:12px;
      border-bottom:1px solid #334155;
      text-align:left;
    }

    table th{
      color:#22c55e;
    }

    @media(max-width:768px){

      .sidebar{
        width:100%;
        height:auto;
        position:relative;
      }

      .main{
        margin-left:0;
      }

      .cards{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

  <div class="login-box">

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="status"></p>

  </div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

  <div class="sidebar">

    <div class="logo">
      AG PANEL
    </div>

    <div class="menu">
      <button>🏠 Dashboard</button>
      <button>👤 Users</button>
      <button>🏏 Matches</button>
      <button>💰 Balance</button>
      <button>⚙ Settings</button>
      <button onclick="logout()">🚪 Logout</button>
    </div>

  </div>

  <div class="main">

    <div class="topbar">
      Welcome Back 👋
    </div>

    <div class="cards">

      <!-- STATS -->

      <div class="card">
        <p>Total Users</p>
        <h2 id="totalUsers">0</h2>
      </div>

      <div class="card">
        <p>Live Matches</p>
        <h2>08</h2>
      </div>

      <div class="card">
        <p>Total Balance</p>
        <h2>$12K</h2>
      </div>

      <div class="card">
        <p>Online Users</p>
        <h2>54</h2>
      </div>

      <!-- ADD USER -->

      <div class="card">

        <p>Add New User</p>

        <input type="text" id="newUser" placeholder="Username">

        <input type="password" id="newPass" placeholder="Password">

        <button onclick="addUser()">Add User</button>

      </div>

      <!-- USER TABLE -->

      <div class="card">

        <p>User List</p>

        <table>

          <thead>
            <tr>
              <th>Username</th>
              <th>Password</th>
            </tr>
          </thead>

          <tbody id="userTable">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

  // DEMO LOGIN

  function login(){

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "1234"){

      document.getElementById("loginPage").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

    }else{

      document.getElementById("status").innerText = "Wrong Username or Password";

    }

  }

  // LOGOUT

  function logout(){

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

  }

  // USER SYSTEM

  let users = [];

  function addUser(){

    let username = document.getElementById("newUser").value;
    let password = document.getElementById("newPass").value;

    if(username === "" || password === ""){
      alert("Fill all fields");
      return;
    }

    users.push({
      username:username,
      password:password
    });

    updateTable();

    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";

    alert("User Added Successfully ✅");

  }

  function updateTable(){

    let table = document.getElementById("userTable");

    table.innerHTML = "";

    users.forEach((user)=>{

      table.innerHTML += `
        <tr>
          <td>${user.username}</td>
          <td>${user.password}</td>
        </tr>
      `;

    });

    document.getElementById("totalUsers").innerText = users.length;

  }

</script>

</body>
</html>
