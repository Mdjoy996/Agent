<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=1400">

<title>10Cricket Mother Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#e9f5ea;
min-width:1400px;
overflow-x:auto;
}

/* TOPBAR */

.topbar{
background:#0f7b32;
color:#fff;
padding:14px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

.logo{
font-size:34px;
font-style:italic;
color:#d7ff5d;
text-shadow:1px 1px 2px #000;
}

.top-right{
display:flex;
gap:10px;
align-items:center;
}

.top-btn{
background:#063d17;
color:#fff;
padding:8px 14px;
border-radius:5px;
font-size:14px;
}

/* NAVBAR */

.navbar{
background:#04280f;
color:white;
display:flex;
padding:12px 20px;
gap:15px;
font-size:14px;
overflow-x:auto;
border-bottom:3px solid #1fc75f;
}

.nav-item{
background:#063d17;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
transition:0.3s;
white-space:nowrap;
font-weight:bold;
border:1px solid transparent;
}

.nav-item:hover{
background:#1fc75f;
color:#fff;
transform:translateY(-2px);
}

.active{
background:#1fc75f;
color:white;
border:1px solid #8fffaa;
}

/* GREEN BAR */

.green-bar{
background:#1fc75f;
height:35px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:1px;
background:#c9dccc;
margin-top:10px;
}

.stat-box{
background:white;
padding:18px;
}

.stat-title{
font-size:14px;
color:gray;
margin-bottom:10px;
}

.stat-value{
font-size:30px;
font-weight:bold;
}

/* MAIN */

.container{
background:white;
margin:20px;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.left-tools{
display:flex;
gap:10px;
}

select,input{
padding:10px;
border:1px solid #ccc;
border-radius:4px;
width:220px;
}

button{
padding:10px 16px;
border:none;
border-radius:4px;
cursor:pointer;
font-weight:bold;
}

.admin-btn{
background:#0f7b32;
color:white;
}

.search-btn{
background:#1ea84b;
color:white;
}

.table-wrapper{overflow-x:auto;}

table{width:100%;border-collapse:collapse;min-width:1300px;}
th,td{padding:14px;border-bottom:1px solid #ddd;font-size:14px;}
th{background:#063d17;color:white;}

.status-active{
background:#1db954;
color:white;
padding:5px 10px;
border-radius:5px;
}

.action-btn{
background:#063d17;
color:white;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
margin-right:5px;
}

</style>

</head>

<body>

<script>
// 🔐 ACCESS
let role = localStorage.getItem("role");
if(role !== "mother"){
alert("Access Denied ❌");
window.location.href="login.html";
}

function openPage(p){ location.href=p; }

function createSuperAdmin(){
let name = prompt("Super Admin Name");
let pass = prompt("Password");
if(!name || !pass) return;

let data = JSON.parse(localStorage.getItem("super_admin")) || [];
data.push({name,pass,role:"super_admin"});
localStorage.setItem("super_admin",JSON.stringify(data));
alert("Super Admin Created ✅");
}
</script>

<!-- TOPBAR -->

<div class="topbar">
<div class="logo">MOTHER PANEL</div>
<div class="top-right">
<div class="top-btn">Mother Admin</div>
<div class="top-btn">Balance 0.00</div>
<div class="top-btn" onclick="location.href='index.html'">Logout</div>
</div>
</div>

<!-- NAVBAR -->

<div class="navbar">
<div class="nav-item active">🏠 Dashboard</div>
<div class="nav-item">👑 Super Admin</div>
<div class="nav-item">⚡ Admin</div>
<div class="nav-item">🧩 Sub Admin</div>
<div class="nav-item">🌐 Agent</div>
</div>

<div class="green-bar"></div>

<!-- STATS -->

<div class="stats">
<div class="stat-box"><div class="stat-title">Super Admin</div><div class="stat-value">0</div></div>
<div class="stat-box"><div class="stat-title">Admin</div><div class="stat-value">0</div></div>
<div class="stat-box"><div class="stat-title">Agents</div><div class="stat-value">0</div></div>
<div class="stat-box"><div class="stat-title">Users</div><div class="stat-value">0</div></div>
</div>

<!-- MAIN -->

<div class="container">

<div class="toolbar">
<div class="left-tools">
<input placeholder="Search...">
<button class="search-btn">Search</button>
</div>

<button class="admin-btn" onclick="createSuperAdmin()">+ Create Super Admin</button>

</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Role</th>
<th>Status</th>
</tr>
</thead>
<tbody>
<tr><td colspan="3">No Data</td></tr>
</tbody>
</table>

</div>

</body>
</html>
